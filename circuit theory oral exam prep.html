<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สรุปวงจรไฟฟ้า — เตรียมสอบปากเปล่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12;
    --bg-panel:#12161F;
    --bg-card:#161B26;
    --border:#232A3B;
    --border-soft:#1B2130;
    --text:#E7EBF2;
    --text-dim:#8D9AB0;
    --text-faint:#5C6779;
    --copper:#C98A4B;
    --copper-dim:#8A5E34;
    --cyan:#4FB4D8;
    --cyan-dim:#336E85;
    --amber:#E0B84D;
    --amber-bg:rgba(224,184,77,0.08);
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai',sans-serif;
    font-weight:400;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  sub,sup{font-family:'JetBrains Mono',monospace; font-size:0.72em;}

  /* ---------- background circuit-trace texture ---------- */
  .trace-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5;
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 0%, transparent 70%);
  }

  /* ---------- header ---------- */
  header{
    position:relative; z-index:2;
    padding:38px 24px 26px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(18,22,31,0.9), rgba(10,13,18,0.4));
  }
  .eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .node-dot{width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text-dim); letter-spacing:0.02em;}
  h1.title{
    font-size:clamp(26px,4.2vw,38px);
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  h1.title .accent{color:var(--copper);}
  .subtitle{color:var(--text-dim); font-size:15px; max-width:640px;}

  /* ---------- nav ---------- */
  nav{
    position:sticky; top:0; z-index:5;
    display:flex; gap:2px; overflow-x:auto;
    background:rgba(10,13,18,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:0 16px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    background:none; border:none; cursor:pointer;
    color:var(--text-faint);
    font-family:'IBM Plex Sans Thai',sans-serif;
    font-size:14px; font-weight:500;
    padding:15px 15px 13px;
    border-bottom:2px solid transparent;
    white-space:nowrap;
    transition:color .15s ease;
  }
  .tab-btn .num{font-family:'JetBrains Mono',monospace; color:var(--copper-dim); margin-right:7px; font-size:12px;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--text); border-bottom-color:var(--copper);}
  .tab-btn.active .num{color:var(--copper);}
  .tab-btn.tips{color:var(--cyan-dim);}
  .tab-btn.tips.active{border-bottom-color:var(--cyan); color:var(--cyan);}

  /* ---------- main layout ---------- */
  main{position:relative; z-index:1; max-width:840px; margin:0 auto; padding:34px 20px 100px;}
  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .chapter-head{margin-bottom:28px;}
  .chapter-head .kicker{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--copper); text-transform:uppercase; letter-spacing:.06em;}
  .chapter-head h2{font-size:24px; margin:6px 0 4px; font-weight:700;}
  .chapter-head .en{color:var(--text-faint); font-size:13.5px; font-family:'JetBrains Mono',monospace;}

  /* ---------- formula cheat strip ---------- */
  .cheat-label{font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin:0 0 10px; letter-spacing:.03em;}
  .cheat-strip{
    display:flex; gap:10px; overflow-x:auto; padding-bottom:14px; margin-bottom:30px;
    border-bottom:1px dashed var(--border);
    scrollbar-width:thin;
  }
  .cheat-card{
    flex:0 0 auto; min-width:150px;
    background:var(--bg-card); border:1px solid var(--border);
    border-left:2px solid var(--copper);
    border-radius:var(--radius);
    padding:11px 13px;
  }
  .cheat-card .cl-label{font-size:11.5px; color:var(--text-dim); margin-bottom:5px;}
  .cheat-card .cl-formula{font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--text);}

  /* ---------- section cards ---------- */
  .section{margin-bottom:26px;}
  .section h3{
    font-size:16.5px; font-weight:600; margin:0 0 10px;
    display:flex; align-items:baseline; gap:9px;
  }
  .section h3::before{
    content:''; width:3px; align-self:stretch; background:var(--cyan); border-radius:2px;
  }
  .section .body{color:#D3D9E2; font-size:15px;}
  .section .body p{margin:0 0 10px;}
  .section .formula-block{
    font-family:'JetBrains Mono',monospace;
    background:#0D1119; border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 16px; margin:10px 0;
    font-size:14.5px; color:var(--copper);
    overflow-x:auto;
  }
  .why-box{
    margin-top:12px;
    background:var(--amber-bg);
    border:1px dashed var(--amber);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .why-box .why-tag{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--amber);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; display:block;
  }
  .why-box p{margin:0 0 8px; font-size:14.5px; color:#EDE3C8;}
  .why-box p:last-child{margin-bottom:0;}
  .score-box{
    margin-top:12px;
    background:rgba(79,180,216,0.07);
    border:1px solid var(--cyan-dim);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .score-box .score-tag{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--cyan);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; display:block;
  }
  .score-box p{margin:0 0 8px; font-size:14.5px; color:#CFE7EF;}
  .score-box p:last-child{margin-bottom:0;}
  .score-box ul{margin:6px 0 0; padding-left:18px; color:#CFE7EF; font-size:14.5px;}
  .score-box li{margin-bottom:4px;}

  /* ---------- quiz ---------- */
  .quiz-wrap{margin-top:34px; padding-top:22px; border-top:1px solid var(--border);}
  .quiz-wrap h3{font-size:15px; color:var(--cyan); font-family:'JetBrains Mono',monospace; margin:0 0 14px; letter-spacing:.03em;}
  .qa{
    border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:8px; overflow:hidden; background:var(--bg-card);
  }
  .qa-q{
    width:100%; text-align:right; background:none; border:none; cursor:pointer;
    color:var(--text); font-family:'IBM Plex Sans Thai',sans-serif; font-size:14.5px;
    padding:13px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;
    text-align:left;
  }
  .qa-q .plus{color:var(--copper); font-family:'JetBrains Mono',monospace; font-size:16px; flex-shrink:0; transition:transform .2s ease;}
  .qa.open .qa-q .plus{transform:rotate(45deg);}
  .qa-a{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .qa-a-inner{padding:0 16px 15px; color:var(--text-dim); font-size:14px; border-top:1px solid var(--border-soft); padding-top:11px;}

  /* ---------- tips panel ---------- */
  .tip-grid{display:grid; gap:14px;}
  .tip-card{
    background:var(--bg-card); border:1px solid var(--border); border-left:2px solid var(--cyan);
    border-radius:var(--radius); padding:16px 18px;
  }
  .tip-card h4{margin:0 0 8px; font-size:15px; color:var(--cyan);}
  .tip-card p, .tip-card li{color:#D3D9E2; font-size:14.5px;}
  .tip-card ul{margin:6px 0 0; padding-left:18px;}
  table.dual{width:100%; border-collapse:collapse; margin-top:8px; font-size:13.5px;}
  table.dual th, table.dual td{border:1px solid var(--border); padding:8px 10px; text-align:left;}
  table.dual th{background:#0D1119; color:var(--text-dim); font-weight:500; font-family:'JetBrains Mono',monospace; font-size:12px;}
  table.dual td.formula{font-family:'JetBrains Mono',monospace; color:var(--copper);}

  footer{text-align:center; color:var(--text-faint); font-size:12px; padding:26px; border-top:1px solid var(--border); font-family:'JetBrains Mono',monospace;}

  @media(max-width:560px){
    header{padding:28px 16px 20px;}
    .cheat-card{min-width:130px;}
  }
</style>
</head>
<body>

<div class="trace-bg"></div>

<header>
  <div class="eyebrow-row">
    <span class="node-dot"></span>
    <span class="eyebrow">CIRCUIT THEORY — บทที่ 1–6</span>
  </div>
  <h1 class="title">เตรียมสอบปากเปล่า<span class="accent">.</span> วงจรไฟฟ้า</h1>
  <p class="subtitle">สรุปละเอียดทั้ง 6 บท พร้อมเหตุผลเชิงลึก ("ทำไม") สำหรับตอบคำถามปากเปล่า สูตรสำคัญ และคำถามฝึกตอบท้ายบท</p>
</header>

<nav id="tabNav"></nav>

<main id="mainContent"></main>

<footer>สรุปเพื่อการทบทวนส่วนตัว — อ้างอิงเนื้อหาจากหนังสือเรียนวงจรไฟฟ้าที่อัปโหลด</footer>

<script>
/* ======================= CONTENT DATA ======================= */
const chapters = [
{
  id:'ch1', number:1, title:'องค์ประกอบและปริมาณในวงจรไฟฟ้า', en:'Electrical Circuit Elements and Quantities',
  formulaSheet:[
    {l:'กระแสไฟฟ้า', f:'i = dq/dt'},
    {l:'แรงดันไฟฟ้า', f:'v = dw/dq'},
    {l:'กำลังไฟฟ้า', f:'p = vi = dw/dt'},
    {l:'พลังงาน', f:'w = ∫ p dt'},
    {l:'กฎของโอห์ม', f:'v = iR ,  i = v/R = Gv'},
  ],
  sections:[
    {h:'1.1 องค์ประกอบวงจร', body:`
      <p>ระบบไฟฟ้าประกอบด้วย 4 ส่วนหลัก คือ <b>แหล่งกำเนิด</b> (จ่ายพลังงาน) <b>โหลด</b> (ใช้พลังงาน) <b>ระบบส่งผ่าน</b> (นำพลังงานจากแหล่งกำเนิดไปยังโหลด) และ <b>อุปกรณ์ควบคุม</b> เมื่อนำองค์ประกอบวงจรมาต่อกันเป็นเส้นทางปิด (closed path) จะเกิดเป็นวงจรไฟฟ้าที่กระแสสามารถไหลวนได้ครบรอบ</p>
      <p>คำว่า "เส้นทางปิด" สำคัญมากในการสอบปากเปล่า — ถ้าถูกถามว่าทำไมต้องเป็นวงจรปิด ให้ตอบว่ากระแสไฟฟ้าคือการไหลของประจุที่ต้องมีจุดเริ่มต้นและจุดสิ้นสุดเชื่อมต่อกัน หากวงจรขาด (เปิด) จะไม่มีเส้นทางให้ประจุไหลครบรอบ กระแสจึงเป็นศูนย์</p>`},
    {h:'1.2 ประจุและกระแส', body:`
      <p>กระแสไฟฟ้าถูกนิยามให้เป็นทิศทางการเคลื่อนที่ของ<b>ประจุบวก</b> ซึ่งในความเป็นจริงตัวพาประจุในโลหะคืออิเล็กตรอน (ประจุลบ) ดังนั้นทิศทางกระแสตามหลักการ (conventional current) จึงตรงข้ามกับทิศทางการไหลจริงของอิเล็กตรอนเสมอ</p>
      <div class="formula-block">i(t) = dq(t)/dt  →  q(t) = q(t₀) + ∫ i dτ  (หน่วย: แอมแปร์, A = C/s)</div>`,
      why:{t:'ทำไมกระแสจึงกำหนดเป็นทิศทางประจุบวก ไม่ใช่อิเล็กตรอน?', p:[
        'เป็นธรรมเนียมทางประวัติศาสตร์ที่เบนจามิน แฟรงคลิน กำหนดไว้ก่อนจะค้นพบอิเล็กตรอน — ทางฟิสิกส์แล้วใช้ได้ทั้งสองแบบเพราะสมการวงจรไม่สนใจว่าตัวพาประจุคืออะไร สนใจแค่ทิศทางการไหลสุทธิของประจุ',
        'ในการสอบปากเปล่า จุดสำคัญคือให้อธิบายได้ว่า "กระแสตามอิเล็กตรอนไหลสวนทางกับกระแสตามหลักการ" ไม่ใช่แค่ท่องนิยาม'
      ]}},
    {h:'1.3 แรงดัน พลังงาน และกำลัง', body:`
      <p><b>แรงดัน (v)</b> คือพลังงานต่อหนึ่งหน่วยประจุที่ใช้ในการเคลื่อนประจุจากจุดหนึ่งไปอีกจุดหนึ่ง มีหน่วยเป็นโวลต์ (V = J/C) ส่วน<b>กำลัง (p)</b> คืออัตราการเปลี่ยนพลังงานต่อเวลา ซึ่งเมื่อรวมกับกระแสจะได้ p = vi</p>
      <p><b>กฎการกำหนดขั้ว-ทิศทางร่วม (passive sign convention):</b> ถ้ากระแสไหล<i>เข้า</i>ขั้วบวกของแรงดันคร่อมองค์ประกอบ แสดงว่าองค์ประกอบนั้นกำลัง<b>รับ (absorb)</b> พลังงาน (p เป็นบวก) แต่ถ้ากระแสไหลออกจากขั้วบวก แสดงว่าองค์ประกอบนั้นกำลัง<b>จ่าย (deliver)</b> พลังงาน (p เป็นลบเมื่อคำนวณด้วยสูตรเดียวกัน)</p>`,
      why:{t:'ทำไมต้องมี Passive Sign Convention?', p:[
        'เพราะไม่อย่างนั้นเราจะบอกไม่ได้ว่าองค์ประกอบแต่ละตัว "รับ" หรือ "จ่าย" พลังงานจากสมการ p=vi เพียงอย่างเดียว การกำหนดทิศทางอ้างอิงให้เป็นมาตรฐานเดียวกันทั้งวงจร ทำให้ตีความเครื่องหมายของ p ได้ทันทีโดยไม่ต้องดูภาพวงจรซ้ำ'
      ]}},
    {h:'1.4 ตัวต้านทานและกฎของโอห์ม', body:`
      <p>ตัวต้านทานเป็นองค์ประกอบเชิงเส้นที่แรงดันแปรผันตรงกับกระแส ตามกฎของโอห์ม v = iR โดย R คือความต้านทาน (Ω) และส่วนกลับของ R คือความนำไฟฟ้า G = 1/R (หน่วยซีเมนส์, S)</p>
      <div class="formula-block">p = vi = i²R = v²/R   (ตัวต้านทานสลายพลังงานเสมอ → p ≥ 0 เสมอ)</div>`,
      why:{t:'ทำไมกำลังของตัวต้านทานเป็นบวกเสมอ?', p:[
        'เพราะ i² และ v² ยกกำลังสองจึงเป็นบวกเสมอไม่ว่ากระแสหรือแรงดันจะมีทิศทางใด นั่นสะท้อนความจริงทางฟิสิกส์ว่าตัวต้านทานเปลี่ยนพลังงานไฟฟ้าเป็นความร้อน (สูญเสียแบบผันกลับไม่ได้) จึงไม่มีทางจ่ายพลังงานคืนให้วงจรได้เลย ต่างจากตัวเก็บประจุและตัวเหนี่ยวนำที่กักเก็บพลังงานและคืนกลับได้'
      ]},
      tip:{t:'สคริปต์พูดให้ได้เต็มคะแนน (จากตัวอย่างที่อาจารย์เช็คถูกจริง)', p:[
        'ถ้าอาจารย์ถามว่า "กฎของโอห์มคืออะไร" แล้วตอบแค่ <b>V = IR</b> เฉย ๆ จะได้คะแนนเพียงครึ่งเดียว (เช่น 5 จาก 10) เพราะยังไม่ได้แสดงว่าเข้าใจความหมายของสมการจริง ๆ',
        '<b>พูดแบบนี้ถึงจะเต็ม:</b> "กฎของโอห์มกล่าวไว้ว่า V = R·I โดยที่ R คือความต้านทานที่เชื่อมโยงแรงดันกับกระแส มีหน่วยเป็นโอห์ม ส่วน V คือแรงดันตกคร่อมอุปกรณ์ไฟฟ้า มีหน่วยเป็นโวลต์ และ I คือกระแสไฟฟ้าที่ไหลผ่าน มีหน่วยเป็นแอมป์"',
        'สังเกตโครงสร้าง: (1) พูดสูตร (2) ไล่อธิบายตัวแปรทุกตัวทีละตัวว่า "คือ...มีหน่วยเป็น..." — ใช้โครงนี้ซ้ำได้กับทุกกฎ/สูตรในเล่ม เพียงแค่เปลี่ยนตัวแปรและนิยาม',
      ]}},
    {h:'1.5 แหล่งกำเนิด', body:`
      <p>แบ่งเป็น <b>แหล่งกำเนิดอิสระ (independent source)</b> ซึ่งค่าแรงดันหรือกระแสไม่ขึ้นกับตัวแปรอื่นในวงจร กับ <b>แหล่งกำเนิดไม่อิสระ / ตามตัวแปร (dependent source)</b> ซึ่งค่าจะแปรผันตามแรงดันหรือกระแสของอีกจุดหนึ่งในวงจร (เขียนสัญลักษณ์เป็นสี่เหลี่ยมข้าวหลามตัด ◇ เพื่อแยกจากแหล่งอิสระที่เป็นวงกลม)</p>`,
      why:{t:'ทำไมต้องแยกสัญลักษณ์แหล่งอิสระกับไม่อิสระ?', p:[
        'เพราะเวลาวิเคราะห์วงจรด้วยทฤษฎีการทับซ้อน (superposition) เราจะ "ปิด" ได้เฉพาะแหล่งอิสระเท่านั้น (แทนที่ด้วยลัดวงจร/เปิดวงจร) ส่วนแหล่งไม่อิสระต้องคงอยู่ในวงจรเสมอเพราะค่าของมันผูกกับตัวแปรอื่นที่ยังไม่รู้ค่า การแยกสัญลักษณ์จึงบอกเราไว้ล่วงหน้าว่าตัวไหนตัดได้ ตัวไหนตัดไม่ได้'
      ]}},
    {h:'1.6 สวิตช์', body:`<p>สวิตช์ในอุดมคติมีสองสถานะ: <b>เปิด (open)</b> — ความต้านทานเป็นอนันต์ กระแสไหลผ่านไม่ได้ (เทียบเท่าวงจรเปิด) และ <b>ปิด (closed)</b> — ความต้านทานเป็นศูนย์ แรงดันคร่อมเป็นศูนย์ (เทียบเท่าวงจรลัด) แนวคิดนี้จะกลับมาใช้บ่อยมากในบทที่ 5-6 เวลาสวิตช์เปลี่ยนสถานะที่ t = 0 เพื่อกระตุ้นการตอบสนองชั่วครู่ (transient)</p>`},
    {h:'1.7 แหล่งกำเนิดสัญญาณขั้น', body:`
      <p>ฟังก์ชันขั้นหนึ่งหน่วย (unit step function) u(t−t₀) ใช้อธิบายสัญญาณที่เปลี่ยนค่าแบบไม่ต่อเนื่องทันทีที่ t = t₀ มีค่า 0 ก่อนเวลานั้นและ 1 หลังเวลานั้น เปรียบเสมือนการเปิดสวิตช์ในทันใด</p>
      <div class="formula-block">u(t−t₀) = 0  เมื่อ t < t₀   และ   u(t−t₀) = 1  เมื่อ t > t₀</div>
      <p>มักใช้จำลองการต่อแหล่งกำเนิดแบบทันทีทันใด (เช่น v(t)=V₀·u(t)) แทนการวาดสวิตช์จริงในวงจร</p>`},
  ],
  quiz:[
    {q:'ทำไมทิศทางกระแสตามหลักการจึงตรงข้ามกับการไหลของอิเล็กตรอน?', a:'เพราะกระแสถูกนิยามตามทิศทางของประจุบวกสมมติตามธรรมเนียมเก่าก่อนรู้จักอิเล็กตรอน ส่วนอิเล็กตรอนเป็นประจุลบจึงไหลสวนทาง'},
    {q:'ถ้ากระแสไหลออกจากขั้วบวกขององค์ประกอบ องค์ประกอบนั้นกำลังทำอะไร?', a:'กำลังจ่ายพลังงานให้วงจร (delivering power) เพราะขัดกับทิศทางอ้างอิง passive sign convention'},
    {q:'เพราะเหตุใดตัวต้านทานจึงมีกำลังไฟฟ้าเป็นบวกเสมอ?', a:'เพราะ p = i²R หรือ v²/R เป็นค่ายกกำลังสองซึ่งเป็นบวกเสมอ สะท้อนว่าตัวต้านทานสลายพลังงานเป็นความร้อนตลอดเวลา ไม่มีทางจ่ายพลังงานคืน'},
    {q:'แหล่งกำเนิดไม่อิสระต่างจากแหล่งอิสระอย่างไรในการวิเคราะห์วงจร?', a:'แหล่งไม่อิสระมีค่าขึ้นกับตัวแปรอื่นในวงจร จึงตัดออกจากวงจรด้วยวิธีทับซ้อนไม่ได้ ต้องคงอยู่เสมอ ต่างจากแหล่งอิสระที่ปิดได้ชั่วคราว'},
    {q:'สวิตช์เปิดในอุดมคติเทียบเท่ากับอะไร และสวิตช์ปิดเทียบเท่ากับอะไร?', a:'สวิตช์เปิด = วงจรเปิด (R=∞) สวิตช์ปิด = วงจรลัด (R=0)'},
  ]
},
{
  id:'ch2', number:2, title:'การวิเคราะห์วงจรตัวต้านทาน', en:'Analysis of Resistive Circuits',
  formulaSheet:[
    {l:'KCL', f:'Σ i เข้า = Σ i ออก'},
    {l:'KVL', f:'Σ v รอบวง = 0'},
    {l:'อนุกรม', f:'R_s = ΣR_j'},
    {l:'แบ่งแรงดัน', f:'v_j = (R_j/R_s)·v_s'},
    {l:'ขนาน', f:'1/R_p = Σ(1/R_j)'},
    {l:'ขนาน 2 ตัว', f:'R_p = R₁R₂/(R₁+R₂)'},
    {l:'แบ่งกระแส', f:'i₁ = R₂/(R₁+R₂)·i'},
  ],
  sections:[
    {h:'2.1 กฎกระแสของเคอร์ชอฟฟ์ (KCL)', body:`
      <p>ผลบวกทางพีชคณิตของกระแสที่ไหลเข้าโนดใด ๆ เท่ากับศูนย์เสมอ (หรือมองอีกมุมคือ กระแสที่ไหลเข้าเท่ากับกระแสที่ไหลออก) กฎนี้มาจาก<b>กฎการอนุรักษ์ประจุ</b> — ประจุไม่สามารถสะสมค้างอยู่ที่โนดได้ (โนดในอุดมคติไม่มีความจุ)</p>`,
      why:{t:'ทำไม KCL จึงเป็นจริงเสมอ?', p:['เพราะโนดไม่ใช่องค์ประกอบที่กักเก็บประจุ ถ้ามีกระแสไหลเข้ามากกว่าออก ประจุจะต้องสะสมเพิ่มขึ้นเรื่อย ๆ ที่จุดนั้น ซึ่งขัดกับความเป็นจริงทางฟิสิกส์ที่ตัวนำในอุดมคติไม่สะสมประจุ']},
      tip:{t:'สคริปต์พูดให้ได้เต็มคะแนน', p:[
        '<i>"กฎกระแสของเคอร์ชอฟฟ์กล่าวไว้ว่า ผลรวมของกระแสที่ไหลเข้าโนดใด ๆ มีค่าเท่ากับผลรวมของกระแสที่ไหลออกจากโนดนั้น โดยที่โนดคือจุดต่อร่วมกันขององค์ประกอบตั้งแต่สองตัวขึ้นไปในวงจร กฎนี้เป็นผลมาจากกฎการอนุรักษ์ประจุ เนื่องจากโนดในอุดมคติไม่สามารถสะสมประจุไว้ได้"</i>',
      ]}},
    {h:'2.2 กฎแรงดันของเคอร์ชอฟฟ์ (KVL)', body:`<p>ผลบวกทางพีชคณิตของแรงดันตลอดวงรอบปิดใด ๆ เท่ากับศูนย์ มาจาก<b>กฎการอนุรักษ์พลังงาน</b> — ถ้าพาประจุหนึ่งหน่วยเดินไปรอบวงจนกลับมาจุดเดิม พลังงานที่ได้และเสียไปต้องหักล้างกันพอดี เพราะศักย์ไฟฟ้าที่จุดเดิมต้องมีค่าเท่าเดิม</p>`,
      tip:{t:'สคริปต์พูดให้ได้เต็มคะแนน', p:[
        '<i>"กฎแรงดันของเคอร์ชอฟฟ์กล่าวไว้ว่า ผลบวกทางพีชคณิตของแรงดันตลอดวงรอบปิดใด ๆ ในวงจรมีค่าเท่ากับศูนย์ โดยที่วงรอบปิดคือเส้นทางที่เริ่มต้นและสิ้นสุดที่จุดเดียวกัน กฎนี้เป็นผลมาจากกฎการอนุรักษ์พลังงาน"</i>',
      ]}},
    {h:'2.3–2.5 การต่อตัวต้านทานแบบอนุกรม ขนาน และผสม', body:`
      <p><b>อนุกรม:</b> กระแสไหลผ่านทุกตัวเท่ากัน (เพราะไม่มีทางแยก) จึงบวกความต้านทานตรง ๆ ได้ R_s = ΣR_j และใช้วงจรแบ่งแรงดัน v_j = (R_j/R_s)v_s — ตัวต้านทานค่ามากกว่าจะกินแรงดันมากกว่า</p>
      <p><b>ขนาน:</b> แรงดันคร่อมทุกตัวเท่ากัน (เพราะขั้วทั้งสองข้างต่อร่วมกัน) จึงบวกความนำ G_p = ΣG_j และใช้วงจรแบ่งกระแส i_j = (G_j/G_p)·i — ตัวต้านทานค่าน้อยกว่า (นำไฟฟ้าดีกว่า) จะรับกระแสมากกว่า</p>
      <p>วงจรผสมคือการไล่รวมทีละคู่จากจุดที่ไกลแหล่งกำเนิดที่สุดเข้ามาหาแหล่งกำเนิด (ลดรูปทีละขั้น)</p>`},
    {h:'2.6 ความต้านทานสมมูลของการต่อแบบเดลตาและแบบสตาร์ (Δ–Y Transform)', body:`
      <p>ใช้เมื่อวงจรมีตัวต้านทาน 3 ตัวต่อกันแบบสามเหลี่ยม (Δ) หรือแบบดาว (Y) ซึ่งไม่ใช่อนุกรมหรือขนานล้วน ๆ ทำให้ลดรูปตรง ๆ ไม่ได้ ต้องแปลงร่างไปมาระหว่างสองแบบก่อน</p>
      <div class="formula-block">R(สตาร์) = ผลคูณของ R ที่ติดขั้วเดียวกันในเดลตา ÷ ผลรวม R ทั้งสามของเดลตา</div>`,
      why:{t:'ทำไมต้องใช้ Δ–Y transform?', p:['เพราะในวงจรแบบสะพาน (bridge) หรือโครงข่ายที่ตัวต้านทานเชื่อมกันเป็นรูปสามเหลี่ยม จะไม่มีคู่ตัวต้านทานใดต่ออนุกรมหรือขนานกันอย่างแท้จริงเลย (มีทางแยกกระแสแทรกอยู่เสมอ) การแปลงรูปร่างทำให้เกิดจุดต่ออนุกรม/ขนานใหม่ที่ลดรูปต่อได้']}},
    {h:'2.7 วิธีแรงดันโนด (Node-Voltage Method)', body:`
      <p>เลือกโนดอ้างอิง (กราวนด์ v=0) แล้วเขียน KCL ที่ทุกโนดที่เหลือ โดยแทนกระแสแต่ละกิ่งด้วยผลต่างแรงดันโนดหารความต้านทาน จะได้ระบบสมการที่ไม่ทราบค่าคือแรงดันโนด หากมีแหล่งแรงดันเชื่อมระหว่างสองโนดที่ไม่มีโนดอ้างอิงร่วม ให้รวมเป็น <b>ซูเปอร์โนด (supernode)</b></p>`},
    {h:'2.8 วิธีกระแสเมช (Mesh-Current Method)', body:`
      <p>ใช้ได้กับวงจรระนาบ (planar) เท่านั้น กำหนดกระแสสมมติไหลวนในแต่ละเมช (ลูปที่ไม่มีลูปอื่นซ้อนอยู่ข้างใน) แล้วเขียน KVL รอบแต่ละเมช หากมีแหล่งกระแสอยู่ระหว่างสองเมช ให้รวมเป็น <b>ซูเปอร์เมช (supermesh)</b></p>`,
      why:{t:'เลือกใช้โนดหรือเมชเมื่อไหร่?', p:['กฎง่าย ๆ : ถ้าวงจรมีโนดน้อยกว่าจำนวนเมช ใช้วิธีแรงดันโนดจะได้สมการน้อยกว่า (คำนวณเร็วกว่า) และถ้ามีเมชน้อยกว่าจำนวนโนด ให้ใช้วิธีกระแสเมชแทน — เลือกวิธีที่ทำให้ระบบสมการมีขนาดเล็กที่สุด']}},
  ],
  quiz:[
    {q:'KCL และ KVL มาจากกฎอนุรักษ์อะไรตามลำดับ?', a:'KCL มาจากการอนุรักษ์ประจุ (โนดไม่สะสมประจุ) ส่วน KVL มาจากการอนุรักษ์พลังงาน (ศักย์ที่จุดเดิมต้องเท่าเดิมเมื่อเดินครบรอบ)'},
    {q:'ทำไมตัวต้านทานค่าน้อยในวงจรขนานถึงรับกระแสมาก?', a:'เพราะแรงดันคร่อมเท่ากันทุกตัว ตามกฎของโอห์ม i=v/R ตัว R น้อยจะให้ i มาก (นำไฟฟ้าได้ดีกว่า กระแสจึงเลือกไหลทางที่ต้านทานน้อยกว่ามากกว่า)'},
    {q:'ซูเปอร์โนดใช้เมื่อไหร่ และซูเปอร์เมชใช้เมื่อไหร่?', a:'ซูเปอร์โนดใช้เมื่อมีแหล่งแรงดันเชื่อมระหว่างสองโนดที่ไม่มีโนดใดเป็นกราวนด์ ซูเปอร์เมชใช้เมื่อมีแหล่งกระแสอยู่ร่วมขอบเขตระหว่างสองเมช'},
    {q:'ทำไมวงจรบริดจ์ (bridge) จึงต้องใช้ Δ–Y transform ในการลดรูป?', a:'เพราะตัวต้านทานในวงจรบริดจ์ไม่มีคู่ใดต่ออนุกรมหรือขนานแท้จริงเลย มีทางแยกกระแสแทรกอยู่เสมอ ต้องแปลงรูปทรงก่อนจึงจะเห็นการต่ออนุกรม/ขนานได้'},
  ]
},
{
  id:'ch3', number:3, title:'ทฤษฎีบทวงจรไฟฟ้า', en:'Circuit Theorems',
  formulaSheet:[
    {l:'แปลงแหล่งกำเนิด', f:'i_s = v_s / R'},
    {l:'R เทเวนิน', f:'R_th = v_oc / i_sc'},
    {l:'วงจรสมมูลเทเวนิน', f:'v_oc อนุกรม R_th'},
    {l:'วงจรสมมูลนอร์ตัน', f:'i_sc ขนาน R_n ,  R_n = R_th'},
    {l:'กำลังสูงสุด', f:'R_L = R_th ,  p_max = v_oc²/4R_th'},
  ],
  sections:[
    {h:'3.1 การแปลงแหล่งกำเนิด (Source Transformation)', body:`
      <p>แหล่งแรงดัน v_s ที่ต่ออนุกรมกับ R สามารถแทนด้วยแหล่งกระแส i_s = v_s/R ที่ต่อขนานกับ R ตัวเดียวกันได้ (และแปลงกลับกันได้) ทั้งสองแบบให้พฤติกรรมที่ขั้วต่อภายนอก<b>เหมือนกันทุกประการ</b> แม้ว่าวงจรภายในจะต่างกัน</p>`,
      why:{t:'ทำไมแปลงแล้ววงจรถึง "เหมือนเดิม" ทั้งที่หน้าตาต่างกัน?', p:['เพราะสิ่งที่โลกภายนอกขั้วต่อ "มองเห็น" คือความสัมพันธ์ v-i ที่ขั้วนั้น ไม่ใช่โครงสร้างภายใน ตราบใดที่วงจรทั้งสองแบบให้เส้นกราฟ v-i เดียวกันที่ขั้วต่อ (same v-oc, same i-sc) โหลดภายนอกจะตอบสนองเหมือนกันทุกประการ โดยไม่รู้เลยว่าข้างในเป็นแหล่งแรงดันหรือกระแส']}},
    {h:'3.2 การทับซ้อน (Superposition)', body:`
      <p>ใช้ได้เฉพาะวงจรเชิงเส้น (linear) ที่มีแหล่งอิสระตั้งแต่ 2 แหล่งขึ้นไป หลักการคือคำนวณผลตอบสนอง (v หรือ i) จากแหล่งอิสระทีละตัว โดย "ปิด" แหล่งอื่นทั้งหมด แล้วนำผลย่อยทั้งหมดมาบวกทางพีชคณิต การปิดแหล่งแรงดัน = แทนด้วยวงจรลัด, การปิดแหล่งกระแส = แทนด้วยวงจรเปิด</p>`,
      why:{t:'ทำไมปิดแหล่งแรงดันด้วยลัดวงจร แต่ปิดแหล่งกระแสด้วยเปิดวงจร?', p:['การ "ปิด" แหล่งกำเนิดหมายถึงทำให้มันจ่ายค่าเป็นศูนย์โดยไม่ทำลายเส้นทางกระแสในวงจร แหล่งแรงดัน 0V ก็คือจุดสองจุดที่ศักย์เท่ากัน = ลัดวงจร ส่วนแหล่งกระแส 0A ก็คือไม่มีกระแสไหลผ่านเส้นนั้นเลย = วงจรเปิด ถ้าทำสลับกันจะทำให้วงจรพัง (เปิดวงจรตรงแหล่งแรงดันจะตัดเส้นทางกระแสทั้งหมดโดยไม่จำเป็น)']}},
    {h:'3.3 ทฤษฎีบทของเทเวนิน (Thevenin)', body:`
      <p>วงจรใด ๆ ที่ประกอบด้วยแหล่งกำเนิดและตัวต้านทาน เมื่อมองจากขั้วสองขั้วที่สนใจ สามารถแทนด้วยแหล่งแรงดัน v_oc (แรงดันวงจรเปิดที่ขั้วนั้น) ต่ออนุกรมกับ R_th (ความต้านทานสมมูลมองจากขั้วนั้นเมื่อปิดแหล่งอิสระทั้งหมด)</p>
      <p>ขั้นตอนหาเทเวนิน: (1) ถอดโหลดออกจากขั้วที่สนใจ (2) หา v_oc โดยคำนวณแรงดันวงจรเปิด (3) หา R_th โดยปิดแหล่งอิสระทั้งหมดแล้วหาความต้านทานสมมูลจากขั้วนั้น (ถ้ามีแหล่งไม่อิสระ ต้องใช้วิธี v_oc/i_sc หรือกระตุ้นด้วย i₀ ทดสอบแทน)</p>`,
      tip:{t:'สคริปต์พูดให้ได้เต็มคะแนน', p:[
        '<i>"ทฤษฎีบทของเทเวนินกล่าวไว้ว่า วงจรใด ๆ ที่ประกอบด้วยแหล่งกำเนิดและตัวต้านทาน เมื่อมองจากขั้วต่อสองขั้วที่สนใจ สามารถแทนที่ด้วยแหล่งกำเนิดแรงดัน v_oc ต่ออนุกรมกับตัวต้านทาน R_th ได้ โดยที่ v_oc คือแรงดันวงจรเปิดที่ขั้วทั้งสองนั้น มีหน่วยเป็นโวลต์ และ R_th คือความต้านทานสมมูลที่มองจากขั้วทั้งสอง เมื่อปิดแหล่งกำเนิดอิสระทั้งหมดในวงจร มีหน่วยเป็นโอห์ม"</i>',
      ]}},
    {h:'3.4 ทฤษฎีบทของนอร์ตัน (Norton)', body:`<p>เป็นคู่แฝดของเทเวนิน — แทนวงจรด้วยแหล่งกระแส i_sc (กระแสลัดวงจรที่ขั้ว) ขนานกับ R_n โดย R_n = R_th เสมอ วงจรเทเวนินและนอร์ตันจึงสมมูลกันได้ด้วยการแปลงแหล่งกำเนิดตามข้อ 3.1</p>`,
      tip:{t:'สคริปต์พูดให้ได้เต็มคะแนน', p:[
        '<i>"ทฤษฎีบทของนอร์ตันกล่าวไว้ว่า วงจรใด ๆ ที่ประกอบด้วยแหล่งกำเนิดและตัวต้านทาน เมื่อมองจากขั้วต่อสองขั้วที่สนใจ สามารถแทนที่ด้วยแหล่งกำเนิดกระแส i_sc ต่อขนานกับตัวต้านทาน R_n ได้ โดยที่ i_sc คือกระแสลัดวงจรที่ขั้วทั้งสองนั้น มีหน่วยเป็นแอมป์ และ R_n คือความต้านทานสมมูลที่ขั้วทั้งสอง ซึ่งมีค่าเท่ากับ R_th ของวงจรเทเวนิน มีหน่วยเป็นโอห์ม"</i>',
      ]}},
    {h:'3.5 การถ่ายโอนกำลังสูงสุด (Maximum Power Transfer)', body:`
      <p>เมื่อมองวงจรจากขั้วโหลดเป็นวงจรสมมูลเทเวนิน โหลด R_L จะได้รับกำลังสูงสุดเมื่อ R_L = R_th พอดี</p>
      <div class="formula-block">p_max = v_oc² / (4R_th) = i_sc² · R_n / 4</div>`,
      why:{t:'ทำไมต้อง R_L = R_th พอดีถึงได้กำลังสูงสุด ไม่ใช่ R_L ยิ่งน้อยยิ่งดี?', p:[
        'p = i²R_L โดย i = v_oc/(R_th+R_L) ดังนั้น p = v_oc²·R_L/(R_th+R_L)². ถ้า R_L น้อยเกินไป กระแสจะสูงแต่ R_L เองมีค่าน้อย (p ผกผันตามด้วย R_L) ถ้า R_L มากเกินไป R_L สูงแต่กระแสจะถูกจำกัดจนต่ำมาก มีจุดสมดุลตรงกลางที่อนุพันธ์ dp/dR_L = 0 ซึ่งพิสูจน์ได้ว่าเกิดที่ R_L = R_th พอดี — เป็นการ "แลกเปลี่ยน" ระหว่างกระแสกับความต้านทานที่เหมาะสมที่สุด',
        'ข้อควรระวังตอนสอบ: ที่จุดนี้ไม่ใช่ประสิทธิภาพสูงสุด (efficiency สูงสุดคือ 50% เท่านั้น เพราะพลังงานอีกครึ่งสูญเสียใน R_th เอง) — กำลังสูงสุดกับประสิทธิภาพสูงสุดเป็นคนละเรื่องกัน'
      ]}},
  ],
  quiz:[
    {q:'การแปลงแหล่งกำเนิดทำได้เพราะเหตุใด?', a:'เพราะโลกภายนอกขั้วต่อสนใจแค่ความสัมพันธ์ v-i ที่ขั้ว ไม่สนโครงสร้างภายใน ตราบที่ v_oc และ i_sc เท่ากัน วงจรทั้งสองรูปแบบจะเทียบเท่ากันสมบูรณ์'},
    {q:'ทำไมเวลาทับซ้อน เราปิดแหล่งแรงดันด้วยลัดวงจรแต่ปิดแหล่งกระแสด้วยวงจรเปิด?', a:'เพราะแหล่งแรงดัน 0V คือลัดวงจร (ศักย์เท่ากันสองจุด) ส่วนแหล่งกระแส 0A คือไม่มีกระแสไหล = วงจรเปิด การทำสลับกันจะตัดเส้นทางกระแสผิดจุดและทำให้ผลลัพธ์ผิด'},
    {q:'ทำไมกำลังสูงสุดที่โหลดได้รับจึงเกิดเมื่อ R_L = R_th ไม่ใช่ R_L→0?', a:'เพราะ p=i²R_L มีทั้งกระแสและ R_L เป็นตัวแปร เมื่อ R_L ต่ำมาก R_L เองก็น้อยทำให้ p น้อย เมื่อ R_L สูงมาก กระแสจะถูกจำกัดมาก จุดสมดุลที่ให้ p สูงสุดคือ R_L=R_th จากการหาอนุพันธ์เท่ากับศูนย์'},
    {q:'ประสิทธิภาพการถ่ายโอนพลังงานที่จุดกำลังสูงสุดคือเท่าไร?', a:'50% เท่านั้น เพราะพลังงานอีกครึ่งหนึ่งสูญเสียไปใน R_th เอง (กำลังสูงสุดกับประสิทธิภาพสูงสุดไม่ใช่เรื่องเดียวกัน)'},
  ]
},
{
  id:'ch4', number:4, title:'ตัวเก็บประจุและตัวเหนี่ยวนำ', en:'Capacitors and Inductors',
  formulaSheet:[
    {l:'พลังงาน C', f:'w_c = ½Cv² = q²/2C'},
    {l:'C อนุกรม', f:'1/C_s = Σ(1/C_j)'},
    {l:'C ขนาน', f:'C_p = ΣC_j'},
    {l:'พลังงาน L', f:'w_L = ½Li²'},
    {l:'L อนุกรม', f:'L_s = ΣL_j'},
    {l:'L ขนาน', f:'1/L_p = Σ(1/L_j)'},
    {l:'สถานะอยู่ตัว DC', f:'C → เปิดวงจร , L → ลัดวงจร'},
    {l:'ความต่อเนื่อง', f:'v_c(0⁺)=v_c(0⁻) , i_L(0⁺)=i_L(0⁻)'},
  ],
  sections:[
    {h:'4.1–4.2 ตัวเก็บประจุ ความจุ และพลังงานสะสม', body:`
      <p>ตัวเก็บประจุกักเก็บพลังงานในรูป<b>สนามไฟฟ้า</b>ระหว่างแผ่นตัวนำสองแผ่นที่คั่นด้วยฉนวน (dielectric) ความสัมพันธ์คือ q = Cv และกระแสที่ไหลผ่านคือ i = C·dv/dt</p>
      <div class="formula-block">w_c(t) = ½Cv²(t)  (พลังงานเป็นฟังก์ชันของแรงดัน "ขณะนั้น" เท่านั้น)</div>`,
      why:{t:'ทำไม i = C·dv/dt ถึงบอกได้ว่าแรงดันคร่อมตัวเก็บประจุเปลี่ยนทันทีไม่ได้?', p:[
        'ถ้า v เปลี่ยนแบบก้าวกระโดด (discontinuous) ในเวลาที่เป็นศูนย์ dv/dt จะมีค่าเป็นอนันต์ ซึ่งหมายถึงต้องใช้กระแสอนันต์ในการเปลี่ยนแรงดัน ซึ่งเป็นไปไม่ได้ในทางปฏิบัติ (ไม่มีแหล่งกำเนิดใดจ่ายกระแสอนันต์ได้) ดังนั้นแรงดันคร่อมตัวเก็บประจุจึงต้อง<b>ต่อเนื่องเสมอ</b> นี่คือที่มาของ v_c(0⁺)=v_c(0⁻)'
      ]},
      tip:{t:'สคริปต์พูดให้ได้เต็มคะแนน', p:[
        '<i>"ความสัมพันธ์ของตัวเก็บประจุกล่าวไว้ว่า กระแสที่ไหลผ่านตัวเก็บประจุมีค่าเท่ากับความจุคูณกับอัตราการเปลี่ยนแปลงของแรงดันคร่อมตัวเก็บประจุตามเวลา หรือ i เท่ากับ C คูณ dv/dt โดยที่ C คือความจุ มีหน่วยเป็นฟารัด และ v คือแรงดันคร่อมตัวเก็บประจุ มีหน่วยเป็นโวลต์"</i>',
      ]}},
    {h:'4.3 การต่อตัวเก็บประจุแบบอนุกรมและขนาน', body:`<p>สังเกตว่าสูตรตัวเก็บประจุ<b>สลับ</b>กับตัวต้านทาน: ต่อ<b>อนุกรม</b>ใช้สูตรแบบ "ส่วนกลับรวมกัน" (เหมือนตัวต้านทานขนาน) และต่อ<b>ขนาน</b>ใช้สูตร "บวกตรง ๆ" (เหมือนตัวต้านทานอนุกรม)</p>`,
      why:{t:'ทำไมสูตร C อนุกรม/ขนานถึงสลับกับ R?', p:['เพราะตัวเก็บประจุอนุกรมแต่ละตัวสะสมประจุ q เท่ากัน (กระแสเดียวกันไหลผ่าน) แต่แบ่งแรงดันกันคนละส่วน ยิ่งต่ออนุกรมมาก พื้นที่เก็บประจุเสมือนถูก "ยืด" ให้บางลง ความจุรวมจึงลดลง (เหมือนแผ่นเก็บประจุห่างขึ้น) ตรงข้ามกับความต้านทานที่อนุกรมแล้วยิ่งกีดขวางกระแสมากขึ้น']}},
    {h:'4.4–4.5 ตัวเหนี่ยวนำ ความเหนี่ยวนำ และพลังงานสะสม', body:`
      <p>ตัวเหนี่ยวนำกักเก็บพลังงานในรูป<b>สนามแม่เหล็ก</b>รอบขดลวด ความสัมพันธ์คือ v = L·di/dt</p>
      <div class="formula-block">w_L(t) = ½Li²(t)  (พลังงานเป็นฟังก์ชันของกระแส "ขณะนั้น" เท่านั้น)</div>`,
      why:{t:'ทำไม v=L·di/dt ถึงบอกได้ว่ากระแสผ่านตัวเหนี่ยวนำเปลี่ยนทันทีไม่ได้?', p:[
        'ถ้า i เปลี่ยนแบบก้าวกระโดด di/dt จะเป็นอนันต์ ซึ่งต้องการแรงดันอนันต์คร่อมตัวเหนี่ยวนำ เป็นไปไม่ได้ในทางปฏิบัติ ดังนั้นกระแสผ่านตัวเหนี่ยวนำจึงต้อง<b>ต่อเนื่องเสมอ</b> ทำให้ i_L(0⁺)=i_L(0⁻) — สังเกตว่าตัวเก็บประจุกับตัวเหนี่ยวนำเป็นคู่ตรงข้าม (dual) กันพอดี: C คุมความต่อเนื่องของ v ส่วน L คุมความต่อเนื่องของ i'
      ]},
      tip:{t:'สคริปต์พูดให้ได้เต็มคะแนน', p:[
        '<i>"ความสัมพันธ์ของตัวเหนี่ยวนำกล่าวไว้ว่า แรงดันคร่อมตัวเหนี่ยวนำมีค่าเท่ากับความเหนี่ยวนำคูณกับอัตราการเปลี่ยนแปลงของกระแสที่ไหลผ่านตามเวลา หรือ v เท่ากับ L คูณ di/dt โดยที่ L คือความเหนี่ยวนำ มีหน่วยเป็นเฮนรี และ i คือกระแสที่ไหลผ่านตัวเหนี่ยวนำ มีหน่วยเป็นแอมป์"</i>',
      ]}},
    {h:'4.6 การต่อตัวเหนี่ยวนำแบบอนุกรมและขนาน', body:`<p>ตัวเหนี่ยวนำมีสูตรอนุกรม/ขนาน<b>เหมือนตัวต้านทาน</b> (ไม่สลับแบบตัวเก็บประจุ) เพราะฟลักซ์แม่เหล็กสะสมสอดคล้องกับกระแสในทิศทางเดียวกับการไหลของกระแสในองค์ประกอบ</p>`},
    {h:'4.7 สถานะอยู่ตัวในวงจรไฟฟ้ากระแสตรง (DC Steady State)', body:`
      <p>เมื่อวงจร DC ถูกขับเป็นเวลานานพอ (ไม่มีการเปลี่ยนแปลงอีกต่อไป) แรงดันและกระแสทุกจุดจะคงที่ ไม่แปรผันตามเวลา — เรียกว่า<b>สถานะอยู่ตัว (steady state)</b></p>`,
      why:{t:'ทำไมตัวเก็บประจุทำตัวเป็นวงจรเปิด และตัวเหนี่ยวนำทำตัวเป็นวงจรลัดในสถานะอยู่ตัว? (คำถามยอดฮิตในสอบปากเปล่า)', p:[
        '<b>ตัวเก็บประจุ → วงจรเปิด:</b> จากสมการ i = C·dv/dt ในสถานะอยู่ตัวทุกอย่างคงที่ ไม่มีการเปลี่ยนแปลงตามเวลาแล้ว ดังนั้น dv/dt = 0 เสมอ ทำให้ i = C·(0) = 0 — ไม่มีกระแสไหลผ่านตัวเก็บประจุเลย ซึ่งตรงกับนิยามของวงจรเปิด (ไม่ใช่ว่าความต้านทานสูง แต่เพราะกระแสเป็นศูนย์โดยธรรมชาติของสมการ) ภาพเปรียบเทียบ: ตัวเก็บประจุ "อิ่มตัว" ด้วยประจุจนไม่รับเพิ่มแล้ว จึงไม่มีกระแสไหลเข้าอีก',
          '<b>ตัวเหนี่ยวนำ → วงจรลัด:</b> จากสมการ v = L·di/dt ในสถานะอยู่ตัว di/dt = 0 เสมอ (กระแสคงที่แล้ว) ทำให้ v = L·(0) = 0 — แรงดันคร่อมตัวเหนี่ยวนำเป็นศูนย์ทั้งที่มีกระแสไหลผ่านอยู่ ซึ่งตรงกับนิยามของวงจรลัด (แรงดันเป็นศูนย์ไม่ว่ากระแสจะเท่าไร) ภาพเปรียบเทียบ: สนามแม่เหล็กในขดลวดคงที่แล้ว ไม่มีการเหนี่ยวนำแรงเคลื่อนไฟฟ้าต้านการเปลี่ยนแปลงอีกต่อไป (เพราะไม่มีอะไรเปลี่ยน)',
          '<b>เทคนิคตอบให้ครบ:</b> อย่าตอบแค่ "เพราะจำได้" ให้ไล่จากสมการนิยาม (v=Ldi/dt หรือ i=Cdv/dt) → บอกว่าสถานะอยู่ตัวหมายถึงอนุพันธ์เทียบเวลาเป็นศูนย์ → สรุปผลที่ได้ วิธีนี้ตอบได้ทุกคำถามแนวนี้แม้จำสูตรลัดไม่ได้'
      ]}},
  ],
  quiz:[
    {q:'ทำไมตัวเก็บประจุทำตัวเป็นวงจรเปิดในสถานะอยู่ตัว?', a:'เพราะ i=C·dv/dt และในสถานะอยู่ตัว v คงที่ ทำให้ dv/dt=0 จึงไม่มีกระแสไหลผ่าน ซึ่งตรงนิยามวงจรเปิด'},
    {q:'ทำไมตัวเหนี่ยวนำทำตัวเป็นวงจรลัดในสถานะอยู่ตัว?', a:'เพราะ v=L·di/dt และในสถานะอยู่ตัว i คงที่ ทำให้ di/dt=0 จึงแรงดันคร่อมเป็นศูนย์ ซึ่งตรงนิยามวงจรลัด'},
    {q:'ทำไมแรงดันคร่อมตัวเก็บประจุเปลี่ยนทันทีไม่ได้ แต่กระแสผ่านตัวต้านทานเปลี่ยนทันทีได้?', a:'เพราะ i=Cdv/dt ถ้า v กระโดดทันที dv/dt จะเป็นอนันต์ ต้องการกระแสอนันต์ซึ่งเป็นไปไม่ได้ ส่วนตัวต้านทานไม่มีความสัมพันธ์เชิงอนุพันธ์กับเวลา จึงเปลี่ยนค่าทันทีได้ตามแรงดันที่จ่ายให้'},
    {q:'สูตร C อนุกรมกับ L อนุกรมต่างกันอย่างไร และทำไม?', a:'C อนุกรมใช้ผลรวมส่วนกลับ (เหมือน R ขนาน) ส่วน L อนุกรมบวกตรง ๆ (เหมือน R อนุกรม) เพราะกลไกทางฟิสิกส์ของสนามไฟฟ้าสะสมประจุกับสนามแม่เหล็กสะสมฟลักซ์ต่างกัน'},
    {q:'ค่า q, v_c(0⁻), และ i_L(0⁻) มีความสำคัญอย่างไรตอนวิเคราะห์วงจรที่มีสวิตช์เปลี่ยนสถานะ?', a:'ใช้เป็นเงื่อนไขเริ่มต้น (initial condition) เพราะ v_c และ i_L ต่อเนื่องข้ามจุดเปลี่ยนสวิตช์ ค่าก่อนสวิตช์ (0⁻) เท่ากับค่าทันทีหลังสวิตช์ (0⁺) เสมอ'},
  ]
},
{
  id:'ch5', number:5, title:'วงจรอันดับหนึ่ง', en:'First-Order Circuits',
  formulaSheet:[
    {l:'ผลตอบสนอง RC', f:'v_c = v_∞ + [v_c(0)−v_∞]e^(−t/τ)'},
    {l:'τ ของ RC', f:'τ = R_th·C'},
    {l:'ผลตอบสนอง RL', f:'i_L = i_∞ + [i_L(0)−i_∞]e^(−t/τ)'},
    {l:'τ ของ RL', f:'τ = L/R_th'},
    {l:'ที่ t=τ', f:'เหลือ 36.8% ของค่าตั้งต้น'},
    {l:'ที่ t=5τ', f:'ถือว่าเข้าสู่สถานะอยู่ตัว (~0)'},
    {l:'Laplace อนุพันธ์อันดับ 1', f:'L{dx/dt} = sX(s) − x(0)'},
  ],
  sections:[
    {h:'5.1–5.2 วงจร RC ที่มีและไม่มีแหล่งกำเนิดอิสระ', body:`
      <p>วงจรอันดับหนึ่งมีองค์ประกอบสะสมพลังงานเพียงตัวเดียว (C หรือ L) ทำให้สมการที่ได้เป็นสมการเชิงอนุพันธ์อันดับหนึ่ง เมื่อลดรูปส่วนที่เหลือของวงจร (ตัวต้านทานและแหล่งกำเนิด) ด้วยทฤษฎีบทเทเวนิน จะเหลือแค่ v_oc อนุกรมกับ R_th ต่อกับตัวเก็บประจุ ทำให้วิเคราะห์ได้ง่ายมาก ไม่ว่าวงจรเดิมจะซับซ้อนแค่ไหน</p>
      <p>กรณี "ไม่มีแหล่งกำเนิดอิสระ" หมายถึงวงจรที่ปล่อยให้ตัวเก็บประจุที่มีประจุสะสมอยู่แล้วคายประจุผ่านตัวต้านทานเท่านั้น (v_∞ = 0)</p>`},
    {h:'5.3 ค่าคงตัวทางเวลา (Time Constant, τ)', body:`
      <p>τ บ่งบอกว่าวงจร "ตอบสนองเร็วหรือช้า" แค่ไหน — τ มากแปลว่าค่อย ๆ เปลี่ยนช้า ๆ, τ น้อยแปลว่าเปลี่ยนเร็ว หน่วยเป็นวินาที สำหรับ RC คือ τ=RC และ RL คือ τ=L/R</p>`,
      why:{t:'ทำไมที่ t=τ เหลือ 36.8% พอดี และทำไมใช้ t=5τ เป็นเกณฑ์ "อยู่ตัวแล้ว"?', p:[
        'ผลตอบสนองธรรมชาติอยู่ในรูป e^(−t/τ) เมื่อแทน t=τ จะได้ e⁻¹ ≈ 0.368 = 36.8% พอดี ซึ่งเป็นคุณสมบัติของฟังก์ชันเอกซ์โพเนนเชียล ไม่ใช่ตัวเลขบังเอิญ',
        'ที่ t=5τ, e⁻⁵ ≈ 0.0067 หรือเหลือไม่ถึง 1% ซึ่งในทางวิศวกรรมถือว่าน้อยจนวัดไม่ออกแล้ว จึงยอมรับกันว่าเป็นจุดที่วงจร "เข้าสู่สถานะอยู่ตัว" ในทางปฏิบัติ (ในทางคณิตศาสตร์จริง ๆ ฟังก์ชันจะเข้าใกล้ศูนย์แต่ไม่ถึงศูนย์เป๊ะจนกว่า t→∞)'
      ]}},
    {h:'5.4–5.5 วงจร RL ที่มีและไม่มีแหล่งกำเนิดอิสระ', body:`<p>คล้ายกับ RC แต่ลดรูปวงจรด้วยทฤษฎีบทนอร์ตัน (i_sc ขนาน R_n) ต่อกับตัวเหนี่ยวนำแทน เพราะตัวแปรสถานะของ L คือกระแส ไม่ใช่แรงดัน การใช้วงจรสมมูลนอร์ตันจึงสอดคล้องธรรมชาติของปัญหามากกว่า</p>`},
    {h:'5.6 ผลตอบสนองต่อสัญญาณเข้าที่มีค่าคงที่', body:`
      <p>รูปแบบคำตอบทั่วไปของวงจรอันดับหนึ่งเมื่อสัญญาณเข้าคงที่ (DC step) คือ</p>
      <div class="formula-block">x(t) = x_∞ + [x(0) − x_∞]·e^(−t/τ)</div>
      <p>โดย x_∞ คือค่าสุดท้ายที่ตัวแปรเข้าสู่ (หาจากการแทนตัวเก็บประจุ/ตัวเหนี่ยวนำด้วยสถานะอยู่ตัวตามบทที่ 4) และ x(0) คือค่าเริ่มต้นทันทีหลังสวิตช์เปลี่ยน</p>`,
      why:{t:'ทำไมสูตรนี้ใช้ได้กับทั้งการประจุและการคายประจุ?', p:['เพราะสูตรนี้คือคำตอบทั่วไปของสมการเชิงอนุพันธ์อันดับหนึ่งเชิงเส้นที่มีสัญญาณเข้าคงที่ ซึ่งครอบคลุมทั้งสองกรณีอยู่แล้วในตัวมันเอง — ถ้า x(0) < x_∞ ค่าจะ "โต" ขึ้นไปหา x_∞ (การประจุ) และถ้า x(0) > x_∞ ค่าจะ "ลด" ลงมาหา x_∞ (การคายประจุ) ไม่ต้องจำสองสูตรแยกกัน']}},
    {h:'5.7 เงื่อนไขเริ่มต้นขององค์ประกอบสะสมพลังงาน', body:`<p>หาเงื่อนไขเริ่มต้นได้จากการวิเคราะห์วงจรที่สถานะอยู่ตัว<b>ก่อน</b>สวิตช์เปลี่ยน (t=0⁻) แล้วใช้คุณสมบัติความต่อเนื่องจากบทที่ 4 (v_c(0⁺)=v_c(0⁻), i_L(0⁺)=i_L(0⁻)) เพื่อยกค่ามาเป็นจุดเริ่มต้นของวงจรใหม่หลังสวิตช์เปลี่ยน (t=0⁺)</p>`},
  ],
  quiz:[
    {q:'ทำไมที่ t=τ ผลตอบสนองธรรมชาติจึงเหลือ 36.8% เสมอ ไม่ว่าวงจรจะเป็นอะไร?', a:'เพราะฟังก์ชันตอบสนองธรรมชาติอยู่ในรูป e^(−t/τ) เสมอ เมื่อ t=τ จะได้ e⁻¹≈0.368 ซึ่งเป็นคุณสมบัติทางคณิตศาสตร์ของฟังก์ชันเลขชี้กำลัง ไม่ขึ้นกับค่า R, C, L จริง'},
    {q:'ทำไมจึงใช้ t=5τ เป็นเกณฑ์บอกว่าเข้าสถานะอยู่ตัวแล้ว ทั้งที่ในทางคณิตศาสตร์ยังไม่ถึงศูนย์จริง?', a:'เพราะ e⁻⁵≈0.0067 (น้อยกว่า 1%) ซึ่งในทางปฏิบัติวิศวกรรมถือว่าเล็กจนไม่มีนัยสำคัญ เป็นการประมาณเพื่อความสะดวก ไม่ใช่ค่าที่แท้จริงทางคณิตศาสตร์'},
    {q:'ทำไมวงจร RC ใช้วงจรสมมูลเทเวนิน แต่วงจร RL นิยมใช้วงจรสมมูลนอร์ตัน?', a:'เพราะตัวแปรสถานะของ C คือแรงดัน จึงเข้ากับแหล่งแรงดัน v_oc อนุกรม R_th ส่วนตัวแปรสถานะของ L คือกระแส จึงเข้ากับแหล่งกระแส i_sc ขนาน R_n ได้ธรรมชาติกว่า'},
    {q:'x_∞ ในสูตรผลตอบสนองหาได้อย่างไร?', a:'หาจากการวิเคราะห์วงจรที่สถานะอยู่ตัวหลังสวิตช์เปลี่ยนนานพอแล้ว โดยแทนตัวเก็บประจุด้วยวงจรเปิด หรือตัวเหนี่ยวนำด้วยวงจรลัด ตามบทที่ 4.7'},
  ]
},
{
  id:'ch6', number:6, title:'วงจรอันดับสอง', en:'Second-Order Circuits',
  formulaSheet:[
    {l:'สมการทั่วไป', f:'a₂x″ + a₁x′ + a₀x = f(t)'},
    {l:'ผลตอบสนองรวม', f:'x = x_n + x_f'},
    {l:'รากสมการลักษณะเฉพาะ', f:'s = [−a₁ ± √(a₁²−4a₂a₀)] / 2a₂'},
    {l:'หน่วงเกิน (overdamped)', f:'x_n = A₁e^(s₁t) + A₂e^(s₂t)'},
    {l:'หน่วงวิกฤติ (critical)', f:'x_n = (A₁+A₂t)e^(s₁t)'},
    {l:'หน่วงขาด (underdamped)', f:'x_n = e^(−αt)(A₁cosω_dt + A₂sinω_dt)'},
    {l:'Laplace อนุพันธ์อันดับ 2', f:'L{d²x/dt²} = s²X(s) − sx(0) − x′(0)'},
  ],
  sections:[
    {h:'6.1–6.2 สมการเชิงอนุพันธ์อันดับสองและผลเฉลย', body:`
      <p>วงจรอันดับสองมีองค์ประกอบสะสมพลังงาน<b>สองตัว</b> (เช่น C กับ L ร่วมกัน หรือ C สองตัว/L สองตัวที่ลดรูปเป็นตัวเดียวไม่ได้) ทำให้สมการที่ได้เป็นอันดับสอง คำตอบสมบูรณ์ประกอบด้วยสองส่วนเสมอ คือผลตอบสนองธรรมชาติ (natural response, x_n) ที่มาจากพลังงานที่สะสมไว้แต่แรกในองค์ประกอบ และผลตอบสนองแบบบังคับ (forced response, x_f) ที่มาจากแหล่งกำเนิดอิสระภายนอก</p>`},
    {h:'6.3–6.4 ผลตอบสนองธรรมชาติและชนิดของมัน', body:`
      <p>หาได้จากสมการลักษณะเฉพาะ (characteristic equation) ซึ่งได้จากการตั้ง f(t)=0 แล้วแทน x″→s², x′→s¹, x→s⁰ รากของสมการนี้ (s₁, s₂) จะกำหนดว่าวงจรมีพฤติกรรมแบบใด:</p>
      <ul style="margin:8px 0 0; padding-left:20px; color:#D3D9E2;">
        <li><b>หน่วงเกิน (overdamped):</b> s₁, s₂ เป็นจำนวนจริงต่างกัน — ค่ากลับสู่สมดุลแบบราบเรียบ ไม่แกว่ง ใช้เวลานานกว่าจะถึงสมดุล</li>
        <li><b>หน่วงวิกฤติ (critically damped):</b> s₁ = s₂ (รากซ้ำ) — กลับสู่สมดุลเร็วที่สุดโดยไม่แกว่งเลย เป็นเส้นแบ่งขอบเขตระหว่างสองแบบ</li>
        <li><b>หน่วงขาด (underdamped):</b> s₁, s₂ เป็นจำนวนเชิงซ้อนสังยุค s=−α±jω_d — ค่าแกว่งไปมา (oscillate) รอบจุดสมดุลก่อนจะสงบลง</li>
      </ul>`,
      why:{t:'ทำไมรากของสมการลักษณะเฉพาะถึงกำหนดว่าวงจรจะแกว่งหรือไม่แกว่ง?', p:[
        'คำตอบของสมการเชิงอนุพันธ์เชิงเส้นอยู่ในรูป e^(st) เสมอ ถ้า s เป็นจำนวนจริง e^(st) จะเป็นเส้นโค้งเอกซ์โพเนนเชียลล้วน ๆ ไม่มีการแกว่ง (เพิ่มขึ้นหรือลดลงราบเรียบ) แต่ถ้า s เป็นจำนวนเชิงซ้อน s=−α±jω_d ตามสูตรออยเลอร์ e^(jω_dt)=cos(ω_dt)+jsin(ω_dt) จะทำให้เกิดพจน์ cos/sin ซึ่งคือการแกว่งไปมา ส่วน e^(−αt) ที่คูณอยู่ข้างหน้าทำหน้าที่เป็นซองห่อ (envelope) ที่ค่อย ๆ หน่วงแอมพลิจูดของการแกว่งให้เล็กลงจนหายไป — α คือตัวกำหนดว่าหน่วงเร็วหรือช้า'
      ]}},
    {h:'6.5–6.6 ผลตอบสนองแบบบังคับและการหาผลตอบสนองบริบูรณ์', body:`

/* ======================= RENDERING ======================= */
const nav = document.getElementById('tabNav');
const main = document.getElementById('mainContent');

chapters.forEach((ch,idx)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0?' active':'');
  btn.dataset.target = ch.id;
  btn.innerHTML = `<span class="num">0${ch.number}</span>${ch.title.split('(')[0].trim()}`;
  nav.appendChild(btn);
});
const tipsBtn = document.createElement('button');
tipsBtn.className = 'tab-btn tips';
tipsBtn.dataset.target = 'tips';
tipsBtn.innerHTML = `<span class="num">✦</span>เคล็ดลับสอบปากเปล่า`;
nav.appendChild(tipsBtn);

chapters.forEach((ch,idx)=>{
  const panel = document.createElement('section');
  panel.className = 'panel' + (idx===0?' active':'');
  panel.id = ch.id;

  let html = `
    <div class="chapter-head">
      <div class="kicker">บทที่ ${ch.number}</div>
      <h2>${ch.title}</h2>
      <div class="en">${ch.en}</div>
    </div>
    <div class="cheat-label">// สูตรสำคัญ — สรุปย่อ</div>
    <div class="cheat-strip">`;
  ch.formulaSheet.forEach(f=>{
    html += `<div class="cheat-card"><div class="cl-label">${f.l}</div><div class="cl-formula">${f.f}</div></div>`;
  });
  html += `</div>`;

  ch.sections.forEach(s=>{
    html += `<div class="section"><h3>${s.h}</h3><div class="body">${s.body}`;
    if(s.why){
      html += `<div class="why-box"><span class="why-tag">ทำไม? — ${s.why.t}</span>`;
      s.why.p.forEach(p=>{ html += `<p>${p}</p>`; });
      html += `</div>`;
    }
    if(s.tip){
      html += `<div class="score-box"><span class="score-tag">เทคนิคได้คะแนนเต็ม — ${s.tip.t}</span>`;
      s.tip.p.forEach(p=>{ html += `<p>${p}</p>`; });
      html += `</div>`;
    }
    html += `</div></div>`;
  });

  html += `<div class="quiz-wrap"><h3>// ฝึกตอบปากเปล่า — คลิกคำถามเพื่อดูเฉลย</h3>`;
  ch.quiz.forEach((qa,i)=>{
    html += `
      <div class="qa" id="${ch.id}-qa${i}">
        <button class="qa-q" onclick="toggleQA('${ch.id}-qa${i}')"><span>${qa.q}</span><span class="plus">+</span></button>
        <div class="qa-a"><div class="qa-a-inner">${qa.a}</div></div>
      </div>`;
  });
  html += `</div>`;

  panel.innerHTML = html;
  main.appendChild(panel);
});

/* tips panel */
const tipsPanel = document.createElement('section');
tipsPanel.className = 'panel';
tipsPanel.id = 'tips';
let tipsHtml = `
  <div class="chapter-head">
    <div class="kicker">ภาคผนวก</div>
    <h2>เคล็ดลับสอบปากเปล่า</h2>
    <div class="en">How to answer oral exam questions</div>
  </div>
  <div class="tip-grid">`;
tipsContent.forEach(t=>{
  tipsHtml += `<div class="tip-card"><h4>${t.h}</h4>`;
  if(t.p){ t.p.forEach(p=>{ tipsHtml += `<p>${p}</p>`; }); }
  if(t.dual){
    tipsHtml += `<table class="dual"><tr><th>Capacitor (C)</th><th>Inductor (L)</th></tr>`;
    t.dual.forEach(row=>{ tipsHtml += `<tr><td class="formula">${row[0]}</td><td class="formula">${row[1]}</td></tr>`; });
    tipsHtml += `</table>`;
  }
  tipsHtml += `</div>`;
});
tipsHtml += `</div>`;
tipsPanel.innerHTML = tipsHtml;
main.appendChild(tipsPanel);

/* ---------- interactivity ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

function toggleQA(id){
  const qa = document.getElementById(id);
  const ans = qa.querySelector('.qa-a');
  const isOpen = qa.classList.contains('open');
  if(isOpen){
    qa.classList.remove('open');
    ans.style.maxHeight = null;
  }else{
    qa.classList.add('open');
    ans.style.maxHeight = ans.scrollHeight + 'px';
  }
}
</script>
